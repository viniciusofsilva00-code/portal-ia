# Configuração do painel (Pages CMS — https://app.pagescms.org)
media:
  input: public/imagens
  output: /portal-ia/imagens

settings:
  commit:
    # Identifica quem salvou: usado pelas regras de permissão (config/permissoes.yml)
    identity: user
    templates:
      create: "Create {path} (via Pages CMS) [por: {userEmail}]"
      update: "Update {path} (via Pages CMS) [por: {userEmail}]"
      delete: "Delete {path} (via Pages CMS) [por: {userEmail}]"
      rename: "Rename {oldPath} to {newPath} (via Pages CMS) [por: {userEmail}]"

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [titulo, data, rascunho, editado_manualmente, origem]
      primary: titulo
      sort: [data, titulo]
      search: [titulo, resumo, tags]
      default:
        sort: data
        order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
        options:
          maxlength: 160
      - name: data
        label: Data de publicação
        type: date
        required: true
        options:
          format: "yyyy-MM-dd"
      - name: resumo
        label: Resumo (uma frase, aparece na home)
        type: text
        options:
          maxlength: 300
      - name: tags
        label: Tags
        type: string
        list: true
      - name: fontes
        label: Fontes (a primeira é a original)
        type: object
        list: true
        fields:
          - name: nome
            label: Nome da fonte
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
            pattern:
              regex: "^https?://"
              message: "Informe uma URL começando com http:// ou https://"
      - name: rascunho
        label: Despublicado (rascunho)
        description: Marque para tirar o post do site sem apagá-lo.
        type: boolean
        default: false
      - name: editado_manualmente
        label: Editado manualmente (protegido da rotina)
        description: Mantenha marcado. A rotina diária nunca altera posts protegidos. Qualquer post salvo pelo painel é marcado automaticamente no deploy.
        type: boolean
        default: true
      - name: origem
        label: Origem
        type: select
        default: painel
        options:
          values: [painel, rotina]
      - name: body
        label: Texto
        type: rich-text

  - name: permissoes
    label: Permissões (só admin)
    type: file
    path: config/permissoes.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: admins
        label: Administradores (usuários do GitHub, acesso total)
        type: string
        list: true
      - name: colaboradores
        label: Colaboradores
        description: "Editor: publica e apaga. Autor: só rascunhos, não apaga nem altera publicados. Revisor: só visualiza. Convide o mesmo e-mail em Collaborators."
        type: object
        list: true
        fields:
          - name: email
            label: E-mail
            type: string
            required: true
          - name: nivel
            label: Nível
            type: select
            required: true
            default: autor
            options:
              values: [editor, autor, revisor]
